<a
  class="flex h-full flex-col overflow-hidden rounded-xl bg-surface text-inherit no-underline shadow-card transition-transform duration-150 hover:-translate-y-0.5 focus-visible:-translate-y-0.5"
  [routerLink]="['/cars', car().id]"
>
  <img
    class="aspect-[4/3] w-full bg-slate-light object-cover"
    appImgFallback
    [src]="car().photoUrl ?? placeholder"
    [alt]="car().brand + ' ' + car().model"
    loading="lazy"
  />
  <div class="px-4 pt-3 pb-4">
    <h3 class="m-0 text-[1.05rem]">{{ car().brand }} {{ car().model }}</h3>
    <p class="mx-0 mt-1 mb-2 text-text-muted">{{ car().year }} · {{ car().mileage | number }} km</p>
    <p class="m-0 font-bold text-primary">{{ car().price | currency: 'MXN' : 'symbol-narrow' : '1.0-0' }}</p>
  </div>
</a>
