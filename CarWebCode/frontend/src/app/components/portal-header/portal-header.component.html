<header class="flex flex-wrap items-center gap-x-4 gap-y-3 border-b-3 border-primary bg-surface px-4 py-3">
  <a [routerLink]="homeLink()" [attr.aria-label]="label() + ' home'">
    <img class="block h-10 w-auto" src="/assets/images/carweb-logo-horizontal.svg" alt="CarWeb" width="169" height="40" />
  </a>
  <span class="portal-header__badge rounded-full bg-graphite px-3 py-[0.3rem] text-[0.85rem] font-semibold text-white">
    <i class="fa-solid fa-user-tie" aria-hidden="true"></i> {{ label() }} portal
  </span>
  <div class="ml-auto flex items-center gap-3">
    <span class="portal-header__name font-semibold">{{ auth.user()?.name }}</span>
    <button
      type="button"
      class="portal-header__logout cursor-pointer rounded-lg border border-primary bg-surface px-[0.9rem] py-2 font-semibold text-primary hover:bg-inferno-tint"
      (click)="logout()"
    >
      <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i> Log out
    </button>
  </div>
</header>
