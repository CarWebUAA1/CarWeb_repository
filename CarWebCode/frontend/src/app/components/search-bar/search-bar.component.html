<form class="flex w-full" role="search" (submit)="submit($event)">
  <label class="visually-hidden" for="site-search">{{ searchLabel() }}</label>
  <input
    id="site-search"
    class="min-w-0 flex-1 rounded-l-lg border border-r-0 border-border-strong bg-surface px-[0.85rem] py-[0.55rem] text-text placeholder:text-text-muted focus:outline-2 focus:-outline-offset-1 focus:outline-ash"
    type="search"
    [placeholder]="placeholder()"
    [value]="query()"
    (input)="query.set($any($event.target).value)"
    autocomplete="off"
  />
  <button
    class="flex cursor-pointer items-center rounded-r-lg border border-primary bg-primary px-[0.85rem] text-white hover:bg-primary-hover"
    type="submit"
    aria-label="Search"
  >
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2" />
      <path d="M20 20l-4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </svg>
  </button>
</form>
