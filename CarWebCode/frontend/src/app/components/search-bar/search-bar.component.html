<form class="search-bar" role="search" (submit)="submit($event)">
  <label class="visually-hidden" for="site-search">Search cars</label>
  <input
    id="site-search"
    class="search-bar__input"
    type="search"
    [placeholder]="placeholder()"
    [value]="query()"
    (input)="query.set($any($event.target).value)"
    autocomplete="off"
  />
  <button class="search-bar__button" type="submit" aria-label="Search">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2" />
      <path d="M20 20l-4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </svg>
  </button>
</form>
