<header class="site-header">
  <a class="site-header__brand" routerLink="/" aria-label="CarWeb home">
    <img src="/assets/images/carweb-logo-horizontal.svg" alt="CarWeb" width="169" height="40" />
  </a>

  <app-search-bar
    class="site-header__search"
    [placeholder]="isSparePartsCatalog ? 'Search spare parts by brand or model' : 'Search cars by brand or model'"
    [searchLabel]="isSparePartsCatalog ? 'Search spare parts' : 'Search cars'"
    (searchSubmit)="onSearch($event)"
  />

  <nav class="site-header__nav" aria-label="Main">
    <a
      routerLink="/cars"
      routerLinkActive="site-header__btn--active"
      class="site-header__btn site-header__btn--secondary"
    >
      Catalog
    </a>
    <a
      routerLink="/spare-parts"
      routerLinkActive="site-header__btn--active"
      class="site-header__btn site-header__btn--secondary"
    >
      Spare parts
    </a>
    <a
      [routerLink]="auth.isManager() ? '/manager' : '/employee'"
      class="site-header__btn site-header__btn--primary site-header__btn--icon"
      [title]="auth.isManager() ? 'Manager access' : 'Employee access'"
    >
      <i class="fa-solid fa-user-tie" aria-hidden="true"></i>
      <span class="visually-hidden">{{ auth.isManager() ? 'Manager access' : 'Employee access' }}</span>
    </a>
  </nav>

  <app-quick-access-sidebar />
</header>
