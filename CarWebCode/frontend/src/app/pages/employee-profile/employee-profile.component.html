<header class="profile-header">
  <a routerLink="/employee" aria-label="Employee home">
    <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Employee portal
  </a>
  <span>My profile</span>
</header>

<main class="profile-page">
  <section class="profile-card">
    <p class="eyebrow">Personal information</p>
    <h1>My profile</h1>

    @if (loading()) {
      <p>Loading your profile...</p>
    } @else {
      @if (message()) {
        <p class="notice" [class.notice--error]="messageType() === 'error'" role="status">
          {{ message() }}
        </p>
      }

      <form [formGroup]="profileForm" (ngSubmit)="saveProfile()">
        <label>
          Full name
          <input type="text" formControlName="name" autocomplete="name" />
        </label>
        <label>
          Phone
          <input type="tel" formControlName="phone" autocomplete="tel" maxlength="15" />
        </label>
        <label>
          Email
          <input type="email" formControlName="email" autocomplete="email" />
        </label>
        <label>
          New password
          <input type="password" formControlName="password" autocomplete="new-password" placeholder="Leave empty to keep it" />
          @if (profileForm.controls.password.touched && profileForm.controls.password.invalid) {
            <small>The password must have at least 8 characters.</small>
          }
        </label>

        <div class="profile-actions">
          <a routerLink="/employee" class="secondary-button">Cancel</a>
          <button type="submit" [disabled]="saving()">
            {{ saving() ? 'Saving...' : 'Save changes' }}
          </button>
        </div>
      </form>
    }
  </section>
</main>
