<main class="register-container">
  <h1>Crear una cuenta</h1>
  <p class="subtitle">Bienvenido a CarWeb</p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label for="name">Nombre completo</label>
    <input
      type="text"
      id="name"
      formControlName="name"
      maxlength="150"
      placeholder="Juan Pérez"
      autocomplete="name"
    />

    <label for="phone">Teléfono</label>
    <input
      type="tel"
      id="phone"
      formControlName="phone"
      maxlength="20"
      placeholder="1234567890"
      autocomplete="tel"
    />

    <label for="email">Correo electrónico</label>
    <input
      type="email"
      id="email"
      formControlName="email"
      maxlength="150"
      placeholder="ejemplo@gmail.com"
      autocomplete="email"
    />

    <label for="password">Contraseña</label>
    <input type="password" id="password" formControlName="password" autocomplete="new-password" />
    <small class="hint">Mínimo 8 caracteres.</small>

    <label for="confirmPassword">Confirmar contraseña</label>
    <input
      type="password"
      id="confirmPassword"
      formControlName="confirmPassword"
      autocomplete="new-password"
    />

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Registrando…' : 'Registrarse' }}
    </button>
  </form>

  <p class="message" [class]="message()?.type" role="status" aria-live="polite">
    {{ message()?.text }}
  </p>

  <p class="switch">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
</main>
